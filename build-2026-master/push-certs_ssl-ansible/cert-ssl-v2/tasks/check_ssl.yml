---
# Парсинг site_url на hostname и port.
- name: Parse SSL site URL
  ansible.builtin.set_fact:
    ssl_site_hostname: "{{ site_url | urlsplit('hostname') }}"
    ssl_site_port: "{{ site_url | urlsplit('port') | default(443, true) }}"
  when:
    - site_url is defined
    - site_url is not none
    - site_url | trim != ""
    - ssl_cert_expected_not_after is defined
    - ssl_cert_expected_not_after is not none

# Проверка возврат ssl certs
- name: Check remote SSL certificate expiration date
  ansible.builtin.shell:
    cmd: |
      set -o pipefail

      openssl s_client \
        -connect "{{ ssl_site_hostname }}:{{ ssl_site_port }}" \
        -servername "{{ ssl_site_hostname }}" \
        </dev/null 2>/dev/null \
      | openssl x509 -noout -enddate \
      | sed 's/^notAfter=//' \
      | xargs -I{} date -u -d "{}" +%Y-%m-%d
    executable: /bin/bash
  register: remote_cert_check
  changed_when:
    - remote_cert_check.stdout | trim != ssl_cert_expected_not_after
  failed_when: >
    remote_cert_check.rc != 0 or
    (remote_cert_check.stdout | trim) == ""
  notify: "{{ service_name }}"
  when:
    - site_url is defined
    - site_url is not none
    - site_url | trim != ""
    - ssl_cert_expected_not_after is defined
    - ssl_cert_expected_not_after is not none
...
